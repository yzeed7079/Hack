<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جارِ الاختراق...</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            font-size: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .prank-box {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f15;
            color: #fff;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            font-family: Tahoma, sans-serif;
        }
        h1 {
            color: #f85149;
            font-size: 35px;
            margin-bottom: 10px;
        }
        p {
            font-size: 20px;
            color: #c9d1d9;
        }
        .laugh-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="terminal" id="terminal"></div>

<div class="prank-box" id="prankBox">
    <h1>🚨 تم تهكيرك من عمانك: منتجع الرياض 🌴😂</h1>
    <p>صيدك النمر! لا تصدق نفسك عاد هههههههههه</p>
    <button class="laugh-btn" onclick="location.reload()">توبة ما أعودها</button>
</div>

<script>
const logs = [
    "Initializing connection to target device...",
    "Bypassing firewall...",
    "Accessing internal storage...",
    "Downloading personal photos and data...",
    "Extracting Roblox passwords...",
    "Injecting payload: SUCCESS.",
    "Formatting system in 3...",
    "2...",
    "1..."
];

let term = document.getElementById('terminal');
let i = 0;

function typeLogs() {
    if (i < logs.length) {
        term.innerHTML += logs[i] + "\n";
        i++;
        setTimeout(typeLogs, 600);
    } else {
        setTimeout(() => {
            document.getElementById('prankBox').style.display = 'flex';
        }, 1000);
    }
}

typeLogs();
</script>

</body>
</html>
